  <rect x="0" y="0" width="288" height="96" rx="6" fill="#f7f9fa" stroke="#a3b0b6" stroke-width="1.2" />
  <text x="16" y="23" fill="#465b68" font-size="12" font-family="Georgia, serif">ENDPOINT</text>
  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">The PCP theorem</text>
  <text x="16" y="72" fill="#465b68" font-size="14" font-family="Georgia, serif">Log random bits; constant queries</text>
</g><text x="20" y="634" fill="#263742" font-size="13" font-family="Georgia, serif">Each arrow names a guarantee used at its destination. Further dependencies are omitted.</text></svg>