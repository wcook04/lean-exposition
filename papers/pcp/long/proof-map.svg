  <text x="16" y="23" fill="#465b68" font-size="12" font-family="Georgia, serif">ASSEMBLED VERIFIER</text>
  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">Three-colouring</text>
  <text x="16" y="72" fill="#465b68" font-size="14" font-family="Georgia, serif">Four nearby polynomials; seven checks</text>
</g><g transform="translate(20,512)">
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#ffffff" />
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#f7f9fa" stroke="#a3b0b6" stroke-width="1.2" />
