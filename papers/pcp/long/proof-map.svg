<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="map-title map-desc" viewBox="0 0 740 644" role="img"><title id="map-title">From algebraic tests to the PCP theorem</title><desc id="map-desc">Low-degree tests and binary encodings supply soundness of the binary low-degree test. Its four nearby polynomials and the local-correction and zero-on-grid bounds feed the three-colouring verifier. The verifier combines with machine and reduction contracts to give the PCP theorem. This is a selected mathematical-use map, not an extracted Lean graph.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#285c76" /></marker></defs><rect width="740" height="644" fill="#ffffff" /><text x="20" y="26" fill="#263742" font-size="15" font-family="Georgia, serif" letter-spacing="1">FROM THE TESTS TO THE THEOREM</text><path d="M 164,160 V 204" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 576,160 V 176 Q 576,184 568,184 H 252 Q 244,184 244,192 V 204" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 308,252 H 432" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 164,300 V 332 Q 164,340 172,340 H 284 V 372" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 576,300 V 332 Q 576,340 568,340 H 460 V 372" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 460,468 V 512" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 308,560 H 432" fill="none" stroke="#285c76" stroke-width="1.6" marker-end="url(#arrow)" /><text x="150" y="180" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="end">point-versus-line</text><text x="150" y="196" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="end">bound</text><text x="412" y="178" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="middle">binary error bounds</text><text x="370" y="230" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="middle">distance</text><text x="370" y="246" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="middle">bounds</text><text x="178" y="323" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="start">four fixed nearby polynomials</text><text x="562" y="323" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="end">grid-constraint bounds</text><text x="446" y="497" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="end">completeness + soundness</text><text x="370" y="538" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="middle">time, randomness</text><text x="370" y="554" fill="#263742" font-size="13.5" font-family="Georgia, serif" text-anchor="middle">and NP reduction</text><g transform="translate(20,64)">
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#ffffff" />
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#f7f9fa" stroke="#a3b0b6" stroke-width="1.2" />
  <text x="16" y="23" fill="#465b68" font-size="12" font-family="Georgia, serif">ALGEBRAIC CHAPTER</text>
  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">Low-degree tests</text>
  <text x="16" y="72" fill="#465b68" font-size="14" font-family="Georgia, serif">Standard; point-versus-line</text>
</g><g transform="translate(432,64)">
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#ffffff" />
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#f7f9fa" stroke="#a3b0b6" stroke-width="1.2" />
  <text x="16" y="23" fill="#465b68" font-size="12" font-family="Georgia, serif">BINARY CHAPTER</text>
  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">Binary encodings</text>
  <text x="16" y="72" fill="#465b68" font-size="14" font-family="Georgia, serif">Set-multilinear encoding; Hadamard test</text>
</g><g transform="translate(20,204)">
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#ffffff" />
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#f7f9fa" stroke="#a3b0b6" stroke-width="1.2" />
  <text x="16" y="23" fill="#465b68" font-size="12" font-family="Georgia, serif">SOUNDNESS BOUND (B15)</text>
  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">Binary low-degree test</text>
