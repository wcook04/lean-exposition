  <text x="16" y="48" fill="#263742" font-size="17" font-weight="bold" font-family="Georgia, serif">Local correction</text>
  <text x="16" y="72" fill="#465b68" font-size="14" font-family="Georgia, serif">and the zero-on-grid test</text>
</g><g transform="translate(228,372)">
  <rect x="0" y="0" width="288" height="96" rx="6" fill="#ffffff" />
