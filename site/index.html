<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%LX_TITLE%</title>
    <meta
      name="description"
      content="%LX_DESCRIPTION%"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%LX_OG_TITLE%" />
    <meta
      property="og:description"
      content="%LX_OG_DESCRIPTION%"
    />
    %LX_OG_URL%
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="describedby" href="%BASE_URL%llms.txt" type="text/plain" />
    <meta name="author" content="Will Cook" />
    <meta name="theme-color" content="#f8f0e2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1526" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("lx-theme");
          if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
        } catch (e) {}
      })();
      // The paper's text waits, hidden but laid out, until its fonts (preloaded below) are in, or
      // 100 ms at most, so a formula never paints in a fallback face and then shifts.
      (function () {
        var root = document.documentElement;
        if (!document.fonts || !document.fonts.load) return;
        root.classList.add("fonts-wait");
        var done = function () {
          root.classList.remove("fonts-wait");
        };
        setTimeout(done, 100);
        document.addEventListener("DOMContentLoaded", function () {
          Promise.all(["1em KaTeX_Main", "italic 1em KaTeX_Math", "1em 'STIX Two Text'"].map(function (face) {
            return document.fonts.load(face);
          })).then(done, done);
        });
      })();
    </script>
    <style>
      html.fonts-wait .paper {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 40rem; margin: 4rem auto; font-family: Georgia, serif; line-height: 1.6">
        The papers, the Lean beside them, the argument map and the comparisons on this site are drawn in the browser and need JavaScript. %LX_NOSCRIPT%
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
