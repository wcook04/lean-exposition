name: Publish reading website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reading-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python -m pip install .
      - name: Capture the authored reading edition
        run: |
          lean-exposition assemble examples/qaoa-sk/evidence-graph.json \
            --long papers/qaoa-sk/long/reasoning-record.md papers/qaoa-sk/long/reasoning-record.json \
            --short papers/qaoa-sk/short/paper.md papers/qaoa-sk/short/correspondence.json \
            --expository papers/qaoa-sk/expository/main.md papers/qaoa-sk/expository/correspondence.json \
            --out build/reading-edition
          python site/scripts/export-static.py build/reading-edition \
            --lean-tree examples/qaoa-sk/upstream/lean \
            --alignment examples/qaoa-sk/alignment
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
        env:
          REQUIRE_STATIC_PARITY: 'true'
      - run: npm run build
        working-directory: site
        env:
          VITE_STATIC_EDITION: 'true'
          VITE_BASE_PATH: /lean-exposition-site/
      - name: Publish only built website files
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          curl --fail --silent https://api.github.com/meta | python -c 'import json,sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' >> "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:wcook04/lean-exposition-site.git build/pages-publish
          find build/pages-publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R site/dist/. build/pages-publish/
          cd build/pages-publish
          git config user.name 'Reading website deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish reading website from ${GITHUB_SHA}"
            git push origin main
          fi
