name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python scripts/check_layout.py
      - run: python scripts/check_links.py
      - run: python -m unittest discover -s tests -v
      - run: lean-exposition audit-sources examples/qaoa-sk/source-lock.json --root examples/qaoa-sk
      - run: lean-exposition scaffold examples/qaoa-sk/evidence-graph.json --out build/qaoa-sk
      - run: lean-exposition check-bundle build/qaoa-sk
