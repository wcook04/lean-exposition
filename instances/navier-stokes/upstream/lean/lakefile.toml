name = "breakdown"
defaultTargets = ["Breakdown", "Challenge", "FractionalChallenge", "CertificateChallenge", "CoerciveChallenge", "ExtendedCertificateChallenge", "ExtendedCoerciveChallenge", "FractionalCertificateChallenge", "FractionalCellSystemChallenge", "CellLayerChallenge", "CellLayerTheorems", "Solution"]

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Breakdown"
globs = ["Breakdown.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "FractionalChallenge"

[[lean_lib]]
name = "CertificateChallenge"

[[lean_lib]]
name = "CoerciveChallenge"

[[lean_lib]]
name = "ExtendedCertificateChallenge"

[[lean_lib]]
name = "ExtendedCoerciveChallenge"

[[lean_lib]]
name = "FractionalCertificateChallenge"

[[lean_lib]]
name = "FractionalCellSystemChallenge"

[[lean_lib]]
name = "CellLayerChallenge"

[[lean_lib]]
name = "CellLayerTheorems"

[[lean_lib]]
name = "Solution"
